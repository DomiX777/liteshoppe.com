<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Naqiva – Talk v2</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0C3A44;--bg2:#072830;--gold:#E8C26A;--gold2:#F5DC9C;--cream:#F6F2EA;--teal:#0E4D5C;--ink:#12343B;--red:#E0604F;
  --e:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Tajawal",sans-serif;color:#fff}
.frame{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%)}
.wm{position:absolute;left:50%;bottom:70px;width:220px;margin-left:-110px;opacity:.85;z-index:60}
.scene{position:absolute;inset:0;opacity:0;animation:sin .45s var(--e) var(--s) both,sout .4s ease-in calc(var(--x) - .4s) forwards}
@keyframes sin{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes sout{from{opacity:1}to{opacity:0}}
.pop{opacity:0;animation:pop .6s var(--spring) var(--d) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.up{opacity:0;animation:up .7s var(--e) var(--d) both}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fin .6s ease var(--d) both}
@keyframes fin{to{opacity:1}}
@keyframes fin45{to{opacity:.45}}
.out{animation:fout .4s ease var(--d) forwards}
@keyframes fout{to{opacity:0}}
.slidein{opacity:0;animation:slidein .9s var(--e) var(--d) both}
@keyframes slidein{from{opacity:0;transform:translateX(var(--fx,-300px))}to{opacity:1;transform:none}}

/* captions */
.cap{position:absolute;inset-inline:60px;top:1440px;text-align:center;font-weight:800;font-size:64px;line-height:1.45;opacity:0;animation:cin .45s var(--e) var(--d) both,cout .25s ease-in var(--o) forwards;text-shadow:0 4px 18px rgba(0,0,0,.35);z-index:50}
@keyframes cin{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
@keyframes cout{to{opacity:0;transform:translateY(-14px)}}
.cap b{background:var(--gold);color:#1B1407;padding:0 16px;border-radius:14px;text-shadow:none;display:inline-block;line-height:1.25;margin:0 4px}
.chip{position:absolute;display:inline-flex;align-items:center;gap:14px;background:#0A2A31;border:3px solid var(--gold);color:#fff;font-weight:800;font-size:52px;padding:10px 30px;border-radius:24px;z-index:20}
.bubble{position:absolute;background:#fff;color:var(--ink);font-weight:800;font-size:50px;padding:24px 34px;border-radius:34px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5);z-index:30;line-height:1.35}
.bubble::after{content:"";position:absolute;bottom:-26px;width:44px;height:44px;background:#fff;transform:rotate(45deg);inset-inline-end:var(--tail,80px);border-radius:6px}

/* room furniture */
.lamp{position:absolute;top:0;width:90px;animation:sway 3s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(245,220,156,.35),rgba(245,220,156,0) 70%)}
.floor{position:absolute;left:0;right:0;top:1180px;bottom:0;background:repeating-linear-gradient(45deg,#06232A 0 60px,#082C34 60px 120px)}
.band{position:absolute;left:0;right:0;top:1100px;height:84px;background:#0A2A31;border-top:6px solid #5B3A22;border-bottom:6px solid #5B3A22;background-image:radial-gradient(circle,#E8C26A 7px,transparent 8px),radial-gradient(circle,#2FA38B 7px,transparent 8px);background-size:80px 84px,80px 84px;background-position:0 50%,40px 50%}
.arch{position:absolute;top:300px;width:300px;height:760px;border-radius:150px 150px 0 0;background:linear-gradient(180deg,#F2C47A,#E9A85A);border:14px solid #0F4A55;box-shadow:inset 0 0 0 6px rgba(255,255,255,.15)}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 47%,#0F4A55 47% 53%,transparent 53%),linear-gradient(0deg,transparent 48%,#0F4A55 48% 51%,transparent 51%);opacity:.5;border-radius:140px 140px 0 0}
.tiles{position:absolute;inset:0 0 740px 0;background-color:#E7F2EF;background-image:linear-gradient(45deg,#CFE6E1 25%,transparent 25%,transparent 75%,#CFE6E1 75%),linear-gradient(45deg,#CFE6E1 25%,transparent 25%,transparent 75%,#CFE6E1 75%);background-size:120px 120px;background-position:0 0,60px 60px}
.person{position:absolute;width:400px;height:820px}
.person svg{width:100%;height:100%;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.blink{animation:blink 3.6s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.flap{opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes flap{from{opacity:1;transform:scaleY(.25)}to{opacity:1;transform:scaleY(1)}}
.board{position:absolute;left:50px;top:230px;width:740px;height:880px;border-radius:44px;background:var(--cream);box-shadow:0 40px 80px -30px rgba(0,0,0,.6);border:10px solid #0F4A55;overflow:hidden}
.board svg{position:absolute;inset:0;width:100%;height:100%}
.rain{animation:rain .9s linear infinite}
@keyframes rain{from{transform:translateY(-40px);opacity:0}20%{opacity:1}to{transform:translateY(300px);opacity:0}}
.drift{animation:drift 7s cubic-bezier(.45,0,.55,1) var(--d) both}
@keyframes drift{0%{transform:translate(0,0)}25%{transform:translate(-110px,170px)}50%{transform:translate(100px,340px)}75%{transform:translate(-60px,500px)}100%{transform:translate(0,610px)}}
.grow{opacity:0;animation:fin 2.2s ease var(--d) both}
.sparkle{position:absolute;width:60px;height:60px;opacity:0;animation:spk 1.6s ease-in-out var(--d) infinite}
@keyframes spk{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.xmark{position:absolute;width:110px;height:110px;border-radius:50%;background:var(--red);display:grid;place-items:center;opacity:0;animation:pop .45s var(--spring) var(--d) both;z-index:5}
.icon{position:absolute;width:230px;height:230px;border-radius:50px;background:#fff;display:grid;place-items:center;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);opacity:0;animation:pop .6s var(--spring) var(--d) both,flt 3s ease-in-out calc(var(--d) + .6s) infinite alternate}
@keyframes flt{to{translate:0 -14px}}
.bottle{position:absolute;filter:drop-shadow(0 40px 50px rgba(0,0,0,.45))}
.shine{position:absolute;overflow:hidden;-webkit-mask-image:url(a/bottle-cut.png);mask-image:url(a/bottle-cut.png);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);transform:translateX(-120%);animation:shn 1.2s ease-in-out var(--d) both}
@keyframes shn{to{transform:translateX(120%)}}
.offer{position:absolute;left:80px;right:80px;top:880px;border-radius:40px;background:var(--cream);color:var(--ink);padding:34px 40px;text-align:center;opacity:0;animation:up .8s var(--e) var(--d) both}
.price{font:700 150px/1 "Outfit";color:var(--teal);direction:ltr}
.old{font:500 60px "Outfit";color:#8AA2A5;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:6px;direction:ltr}
.cta{display:inline-block;margin-top:18px;background:var(--teal);color:#fff;font-weight:900;font-size:62px;padding:18px 70px;border-radius:999px;animation:pulse 1.1s ease-in-out var(--d) infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
</style>
</head>
<body>

  <img class="wm" src="a/logo.svg" alt="naqiva">

<script>
var NS = "http://www.w3.org/2000/svg";

  s += '<rect x="152" y="560" width="40" height="210" rx="16" fill="' + pants + '"/><rect x="208" y="560" width="40" height="210" rx="16" fill="' + pants + '"/>';
  s += '<ellipse cx="166" cy="776" rx="40" ry="18" fill="#141A1C"/><ellipse cx="234" cy="776" rx="40" ry="18" fill="#141A1C"/>';
  // arms (behind torso)
  function arm(x, rot, cls) {
    return '<g transform="translate(' + x + ',352)"><g class="' + (cls || '') + '" style="transform:rotate(' + rot + 'deg)">' +

  }
  s += arm(130, o.armL || 10, o.armLc) + arm(270, o.armR || -10, o.armRc);
  // torso
  s += '<path d="M126 360 Q126 330 160 326 L240 326 Q274 330 274 360 L268 585 Q200 600 132 585 Z" fill="' + top + '"/>';

  // hair front
  if (o.hair === "long") {
    s += '<path d="M112 222 Q104 108 200 104 Q296 108 288 222 Q270 150 214 146 Q168 172 112 222Z" fill="#8C6B52" ' + (o.shineAt ? 'style="animation:fout .8s ease ' + o.shineAt + 's forwards"' : '') + '/>';
    if (o.shineAt !== undefined) s += '<path d="M112 222 Q104 108 200 104 Q296 108 288 222 Q270 150 214 146 Q168 172 112 222Z" fill="#3A2417" style="opacity:0;animation:fin .8s ease ' + o.shineAt + 's forwards"/>';

  if (o.hair === "bun") s += '<circle cx="200" cy="106" r="40" fill="#1E1410"/><path d="M114 210 Q108 112 200 108 Q292 112 286 210 Q262 150 200 150 Q138 150 114 210Z" fill="#1E1410"/>';

  var bro = o.brows === "worried" ? '<path d="M152 196 Q168 186 184 198" /><path d="M216 198 Q232 186 248 196"/>' : '<path d="M152 198 Q168 188 184 196"/><path d="M216 196 Q232 188 248 198"/>';
  s += '<g fill="none" stroke="#2A1810" stroke-width="6" stroke-linecap="round">' + bro + '</g>';
  s += '<path d="M198 240 Q192 258 204 258" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="5" stroke-linecap="round"/>';
  s += '<circle cx="150" cy="258" r="14" fill="#E9867A" opacity=".35"/><circle cx="250" cy="258" r="14" fill="#E9867A" opacity=".35"/>';
  if (o.mood2) {

  if (o.talk) {
    var anims = o.talk.map(function (w) { var n = Math.max(2, Math.round(w[1] / .16)); return 'flap .16s ease-in-out ' + w[0] + 's ' + n + ' alternate'; }).join(',');
    s += '<ellipse class="flap" cx="200" cy="274" rx="20" ry="16" fill="#7A2E22" style="animation:' + anims + '"/>';
  }
  var wrap = '<div class="person" style="left:' + o.x + 'px;top:' + o.y + 'px;transform:scale(' + (o.scale || 1) + ');transform-origin:50% 100%' + (o.flip ? ';' : '') + '"><div class="bob" style="animation-delay:' + (o.bd || 0) + 's;width:100%;height:100%"><svg viewBox="0 0 400 820">' + s + '</svg></div></div>';
  return wrap;
}

/* captions */
function cap(t0, t1, html) { frame.appendChild(el('<div class="cap" style="--d:' + t0 + 's;--o:' + (t1 - .25) + 's">' + html + '</div>')); }

/* rooms */
var LAMPS = '<div class="glow" style="left:100px;top:40px"></div><div class="glow" style="right:100px;top:40px"></div>' +
  '<svg class="lamp" style="left:205px" viewBox="0 0 90 260"><line x1="45" y1="0" x2="45" y2="120" stroke="#C9A04F" stroke-width="4"/><path d="M20 130 L70 130 L80 200 L45 240 L10 200 Z" fill="#E8C26A"/><path d="M30 140 L60 140 L66 196 L45 222 L24 196Z" fill="#FFF2C6"/></svg>' +
  '<svg class="lamp" style="right:205px;animation-delay:-1.5s" viewBox="0 0 90 260"><line x1="45" y1="0" x2="45" y2="120" stroke="#C9A04F" stroke-width="4"/><path d="M20 130 L70 130 L80 200 L45 240 L10 200 Z" fill="#E8C26A"/><path d="M30 140 L60 140 L66 196 L45 222 L24 196Z" fill="#FFF2C6"/></svg>';
var SALON = '<div class="arch" style="left:60px"></div><div class="arch" style="right:60px"></div>' + LAMPS + '<div class="band"></div><div class="floor"></div>';
var BATH = '<div class="tiles"></div><div style="position:absolute;left:0;right:0;top:1100px;height:84px;background:#0E4D5C"></div><div class="floor"></div>' +
  '<div style="position:absolute;left:330px;top:260px;width:420px;height:520px;border-radius:210px 210px 30px 30px;background:linear-gradient(160deg,#F7FBFA,#BFDCD7);border:14px solid #C9A04F"></div>';

var SALMA = { skin: "#E8B48C", top: "#C8643F", pants: "#2B3F4A", hair: "long", collar: true };
var IMANE = { skin: "#C98E66", top: "#FFFFFF", pants: "#1E2E36", hair: "bun", apron: true };
function P(base, extra) { var o = {}; for (var k in base) o[k] = base[k]; for (var k2 in extra) o[k2] = extra[k2]; return o; }

var hexes = function (svg, pts, opts) {
  pts.forEach(function (q, k) {
    var s = q[2] || 18, pp = [];
    for (var i = 0; i < 6; i++) { var a = i / 6 * 6.283 + rnd() * .5, r = s * (.75 + rnd() * .35); pp.push((q[0] + Math.cos(a) * r).toFixed(1) + "," + (q[1] + Math.sin(a) * r).toFixed(1)); }
    var g = document.createElementNS(NS, "g"), p = document.createElementNS(NS, "polygon");
    p.setAttribute("points", pp.join(" ")); p.setAttribute("fill", "#fff"); p.setAttribute("stroke", "#9AAEB1"); p.setAttribute("stroke-width", "3"); g.appendChild(p);
    g.style.transformBox = "fill-box"; g.style.transformOrigin = "center";
    if (opts && opts.stick) { g.style.opacity = 0; g.style.animation = "stick .55s cubic-bezier(.16,1,.3,1) " + (opts.stick + k * opts.step).toFixed(2) + "s both"; g.style.setProperty("--fx", ((rnd() - .5) * 260).toFixed(0) + "px"); g.style.setProperty("--fy", (-420 - rnd() * 200).toFixed(0) + "px"); }
    if (opts && opts.pick) { g.style.opacity = 0; g.style.animation = "pop .4s cubic-bezier(.34,1.56,.64,1) " + (opts.pick + k * opts.step).toFixed(2) + "s both"; }
    if (opts && opts.grab) {
      var ring = document.createElementNS(NS, "circle"); ring.setAttribute("cx", q[0]); ring.setAttribute("cy", q[1]); ring.setAttribute("r", s + 9); ring.setAttribute("fill", "none"); ring.setAttribute("stroke", "#C9A04F"); ring.setAttribute("stroke-width", "7");
      ring.style.transformBox = "fill-box"; ring.style.transformOrigin = "center"; ring.style.opacity = 0; ring.style.animation = "grab .5s cubic-bezier(.34,1.56,.64,1) " + (opts.grab + k * .06).toFixed(2) + "s both"; ring.style.setProperty("--fx", ((rnd() - .5) * 300).toFixed(0) + "px"); ring.style.setProperty("--fy", (420 + rnd() * 200).toFixed(0) + "px"); g.appendChild(ring);
      g.style.animation = "away 1.1s cubic-bezier(.5,0,.75,0) " + (opts.grab + 1.8 + k * .05).toFixed(2) + "s forwards"; g.style.setProperty("--ax", ((rnd() - .5) * 220).toFixed(0) + "px");
    }
    svg.appendChild(g);
  });
};
var st = document.createElement("style");
st.textContent = "@keyframes stick{from{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(90deg)}to{opacity:1;transform:none}}@keyframes grab{from{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.4)}to{opacity:1;transform:none}}@keyframes away{to{opacity:0;transform:translate(var(--ax),-600px) rotate(60deg)}}";
document.head.appendChild(st);
var STRAND = function (id, dull) {
  return '<svg viewBox="0 0 740 880" id="' + id + '"><defs><linearGradient id="hg' + id + '" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6B4A33"/><stop offset=".5" stop-color="#3F2A1D"/><stop offset="1" stop-color="#2A1B12"/></linearGradient></defs>' +
    '<path d="M-40 470 C 120 380, 260 560, 400 460 S 640 360, 800 440" fill="none" stroke="url(#hg' + id + ')" stroke-width="110" stroke-linecap="round"/>' +
    '<path d="M-40 470 C 120 380, 260 560, 400 460 S 640 360, 800 440" fill="none" stroke="#5A4230" stroke-width="110" stroke-dasharray="4 40" opacity=".5"/>' +
    (dull ? '<path d="M-40 470 C 120 380, 260 560, 400 460 S 640 360, 800 440" fill="none" stroke="#C8C2B6" stroke-width="112" opacity="' + (dull === true ? .45 : 0) + '" ' + (typeof dull === "number" ? 'style="animation:fin45 .8s ease ' + dull + 's forwards"' : '') + '/>' : '') + '</svg>';
};
var SPTS = [[40,430],[110,405],[180,430],[250,470],[320,480],[390,462],[460,430],[530,405],[600,398],[670,410],[80,505],[210,520],[360,515],[510,470],[650,465]];

/* ================= TALK SHOW v2 (male host, natural motion, smooth captions) ================= */
var TOTAL = 71;
var css2 = document.createElement("style");
css2.textContent =
  ".card2{position:absolute;left:40px;right:40px;top:200px;height:540px;border-radius:44px;background:var(--cream);border:10px solid #0F4A55;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);overflow:hidden;opacity:0;animation:cardin .8s cubic-bezier(.22,1,.36,1) var(--d) both}" +
  "@keyframes cardin{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}" +
  ".card2 svg{position:absolute;inset:0;width:100%;height:100%}" +
  ".title{position:absolute;left:50%;transform:translateX(-50%);top:100px;white-space:nowrap;z-index:20}" +
