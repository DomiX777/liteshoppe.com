<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Naqiva EP01</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Outfit:wght@600;800&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p1:#3B1A70;--p2:#1F0B44;--y:#FFD23F;--y2:#FFB627;--w:#FFFFFF;--blue:#4FC3F7;--blue2:#1E88E5;--ink:#2A1056;--teal:#1E8C8C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#12062A}
body{font-family:"Tajawal",sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--p2)}
.layer{position:absolute;inset:0;transform-origin:50% 50%}
svg{display:block}
.abs{position:absolute}
.bubble{position:absolute;background:#fff;color:var(--ink);font-weight:900;font-size:56px;line-height:1.38;padding:30px 40px;border-radius:46px;box-shadow:0 24px 50px -20px rgba(10,0,30,.6);text-align:center;transform-origin:var(--ox,50%) var(--oy,100%)}
.bubble .tail{position:absolute;width:60px;height:60px;background:#fff;border-radius:8px;transform:rotate(45deg)}
.bubble .k{background:var(--y);border-radius:12px;padding:0 10px}
.wd{display:inline-block;margin:0 6px;transform-origin:50% 80%}
#cap{position:absolute;left:40px;right:40px;top:1575px;text-align:center}
#cap .box{display:inline-block;background:rgba(18,5,44,.78);border:3px solid rgba(255,210,63,.55);border-radius:34px;padding:14px 34px 20px;font-weight:900;font-size:68px;line-height:1.35;color:#fff;box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
#cap .wd{transition:none;color:rgba(255,255,255,.38)}
#cap .wd.on{color:#fff}
#cap .wd.k.on{color:var(--y)}
#cap .wd.cur,#cap .wd.k.cur{color:#1A0838;background:var(--y);border-radius:14px;padding:0 10px}
#pres{display:none}
#prog{position:absolute;left:0;top:0;height:12px;background:linear-gradient(90deg,#FFD23F,#4FC3F7);border-radius:0 6px 6px 0;z-index:9}
.chip{position:absolute;display:inline-flex;align-items:center;gap:12px;background:rgba(20,6,48,.82);border:3px solid var(--y);color:#fff;font-weight:900;font-size:40px;padding:10px 28px;border-radius:999px;white-space:nowrap}
.title{font-family:"Lalezar",sans-serif;color:var(--y);font-size:118px;line-height:1.05;text-align:center;-webkit-text-stroke:10px #1A0838;paint-order:stroke fill;text-shadow:0 10px 30px rgba(0,0,0,.4)}
.card{position:absolute;background:#FFF9EE;border-radius:48px;box-shadow:0 30px 60px -24px rgba(5,0,20,.7);color:var(--ink);overflow:hidden}
.pill{display:inline-block;background:var(--y);color:#1A0838;font-weight:900;border-radius:999px;padding:6px 26px}
.lbl{position:absolute;font-weight:900;color:#1A0838;background:#fff;border-radius:999px;padding:8px 24px;font-size:38px;white-space:nowrap;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
#wipe{position:absolute;left:50%;top:50%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;border-radius:50%;background:radial-gradient(circle,#7FD8FF 0%,#2E9BEA 45%,#1565C0 70%,#3B1A70 72%);transform:scale(0)}
.check{display:flex;align-items:center;gap:26px;font-weight:900;font-size:46px;line-height:1.3;padding:22px 34px;background:#fff;border-radius:32px;margin:0 40px 26px;box-shadow:0 10px 24px -14px rgba(40,10,90,.5)}
.check .ic{flex:none;width:76px;height:76px;border-radius:50%;background:#2BB673;display:flex;align-items:center;justify-content:center}
</style>
</head>
